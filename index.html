<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動簽到系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Babel (用來解析 React) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 設定 Import Map，讓我們可以直接 import React 和圖示庫 -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <!-- 這裡開始是 React 程式碼 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { QrCode, CheckCircle, XCircle, User, UserCheck, Loader2, RefreshCcw, ScanLine, AlertCircle, CalendarDays } from 'lucide-react';

        // ----------------------------------------------------------------------
        // 設定與 API
        // ----------------------------------------------------------------------
        // 【重要】請將下方網址替換為您部署 Google Apps Script 後取得的 "Web App URL"
        const API_URL = "https://script.google.com/macros/s/AKfycbw8CVz0OvO3mU1KAONyJ4amDj49eCv0HZ5wVUNLgYtJa-LCAgZel2UxvxAMQGQn8Ro3WA/exec";

        function App() {
            // ----------------------------------------------------------------
            // 狀態管理
            // ----------------------------------------------------------------
            const [session, setSession] = useState(''); 
            const [employeeId, setEmployeeId] = useState('');
            const [name, setName] = useState('');
            
            const [status, setStatus] = useState('idle'); 
            const [resultMsg, setResultMsg] = useState('');
            
            const [activitySubTitle, setActivitySubTitle] = useState('');
            const [sessionList, setSessionList] = useState([]); 
            
            // 判斷場次是否被鎖定 (例如從 URL 帶入參數時)
            const [isSessionLocked, setIsSessionLocked] = useState(false);
            
            // 【新增】判斷是否正在初始化載入資料 (預設為 true)
            const [isInitialLoading, setIsInitialLoading] = useState(true);

            // ----------------------------------------------------------------
            // 品牌色票
            // ----------------------------------------------------------------
            const theme = {
                primary: '#EE1C25',    // Dinkle Red
                secondary: '#333333',  // Dark Grey
                bg: '#F3F4F6',        // Light Grey
                success: '#10B981',    // Green
                warning: '#F59E0B',    // Amber
                error: '#EF4444',      // Red
            };

            // ----------------------------------------------------------------
            // 初始化：直接抓取最新資料 (無快取)
            // ----------------------------------------------------------------
            useEffect(() => {
                if (API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                    setIsInitialLoading(false); // 如果網址沒設，直接結束載入狀態以免卡住
                    return;
                }

                const autoSelectFromUrl = (list) => {
                    try {
                        const params = new URLSearchParams(window.location.search);
                        const indexParam = params.get('i');
                        if (indexParam !== null) {
                            const index = parseInt(indexParam, 10);
                            if (!isNaN(index) && list[index]) {
                                setSession(list[index]);
                                setIsSessionLocked(true);
                            }
                        }
                    } catch (e) {
                        console.error("URL 參數解析失敗", e);
                    }
                };

                // 直接發送請求
                fetch(API_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            if (data.activityName) setActivitySubTitle(data.activityName);
                            if (data.sessions && Array.isArray(data.sessions)) {
                                setSessionList(data.sessions);
                                
                                if (data.sessions.length === 1) {
                                    setSession(data.sessions[0]);
                                } else if (data.sessions.length > 1) {
                                    autoSelectFromUrl(data.sessions);
                                }
                            }
                        }
                    })
                    .catch(err => console.error("無法取得最新資料", err))
                    .finally(() => {
                        // 【關鍵】無論成功或失敗，都標記初始化完成，解鎖按鈕
                        setIsInitialLoading(false);
                    });
            }, []);

            // ----------------------------------------------------------------
            // 核心邏輯
            // ----------------------------------------------------------------
            const handleCheckIn = async (e) => {
                e.preventDefault();
                
                // 驗證邏輯：只有在場次清單不為空時，才強制驗證
                if (sessionList.length > 0 && !session) {
                    alert('請先選擇活動場次');
                    return;
                }
                if (!employeeId) {
                    alert('請輸入員工工號');
                    return;
                }
                if (!name) {
                    alert('請輸入員工姓名');
                    return;
                }

                if (API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                    alert("請先開啟程式碼編輯，將 'API_URL' 替換為您的 Google Apps Script 網址！");
                    return;
                }

                setStatus('loading');
                
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify({ 
                            session: session, 
                            id: employeeId, 
                            name: name 
                        }),
                    });

                    const data = await response.json();

                    if (data.status === 'success') {
                        setStatus('success');
                        setResultMsg(`${data.data.session ? `[${data.data.session}] ` : ''}工號:${data.data.id} ${data.data.name}`);
                    } else if (data.status === 'duplicate') {
                        setStatus('duplicate');
                        setResultMsg(`${data.data.session ? `[${data.data.session}] ` : ''}工號:${data.data.id} ${data.data.name}`);
                    } else {
                        setStatus('error');
                        setResultMsg(data.message || '找不到資料');
                    }
                } catch (error) {
                    console.error('Check-in error:', error);
                    setStatus('error');
                    setResultMsg('網路連線錯誤或系統異常');
                }
            };

            const handleReset = () => {
                setEmployeeId('');
                setName('');
                setStatus('idle');
                setResultMsg('');
                // 不重置 session
            };

            const qrData = encodeURIComponent(`SESSION:${session},ID:${employeeId},NAME:${name}`);
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrData}&color=EE1C25`;

            // ----------------------------------------------------------------
            // UI 渲染
            // ----------------------------------------------------------------
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 font-sans relative overflow-hidden" 
                    style={{ backgroundColor: theme.bg }}>
                
                {/* 背景裝飾 */}
                <div className="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-white to-transparent opacity-50 z-0"></div>
                <div className="absolute -top-20 -right-20 w-64 h-64 rounded-full opacity-10 blur-3xl" style={{ backgroundColor: theme.primary }}></div>
                <div className="absolute top-40 -left-20 w-40 h-40 rounded-full opacity-5 blur-2xl" style={{ backgroundColor: theme.primary }}></div>

                <div className="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden z-10 relative border-t-8" 
                    style={{ borderColor: theme.primary }}>
                    
                    {/* Header 區域 */}
                    <div className="pt-8 pb-4 px-6 text-center bg-white">
                    <div className="flex flex-col items-center justify-center mb-4">
                        <div className="px-3 py-1 inline-block">
                        <img src="https://i.meee.com.tw/bxhfqhV.jpg" alt="Dinkle" className="h-14" />
                        </div>
                        <div className="text-gray-500 font-bold text-lg tracking-wide">
                        因联結而喜悅!!
                        </div>
                        <div className="text-gray-400 text-xs tracking-wider">
                        Delight Through Connections
                        </div>
                    </div>
                    
                    <div className="h-px w-24 mx-auto bg-gray-200 my-4"></div>

                    {/* 標題區域 */}
                    <div className="flex flex-col items-center justify-center gap-1 min-h-[3.5rem]">
                        <div className="flex items-center gap-2">
                            <ScanLine className="w-6 h-6" style={{ color: theme.primary }} />
                            <h1 className="text-xl font-bold text-gray-800">町洋企業活動簽到</h1>
                        </div>
                        
                        {activitySubTitle ? (
                        <span className="text-base font-medium text-gray-500 bg-gray-100 px-3 py-0.5 rounded-full mt-1 animate-in fade-in duration-300">
                            {activitySubTitle}
                        </span>
                        ) : (
                        // 載入中的骨架屏
                        <div className="h-6 w-32 bg-gray-100 rounded animate-pulse mt-1"></div>
                        )}
                    </div>
                    </div>

                    {/* 內容區域 */}
                    <div className="px-8 pb-8 pt-2">
                    
                    {(status === 'idle' || status === 'loading') && (
                        <form onSubmit={handleCheckIn} className="space-y-5">
                        
                        {/* 場次選單 */}
                        {sessionList.length > 0 && (
                            <div className="space-y-1.5">
                                <label className="text-sm font-bold text-gray-600 pl-1">活動場次 Session <span className="text-red-500">*</span></label>
                                <div className="relative group">
                                <CalendarDays className="absolute left-3 top-3.5 w-5 h-5 text-gray-400 group-focus-within:text-red-500 transition-colors" />
                                <select
                                    value={session}
                                    onChange={(e) => setSession(e.target.value)}
                                    className={`w-full pl-10 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:bg-white focus:border-red-500 focus:outline-none transition-all duration-200 appearance-none text-gray-700 disabled:bg-gray-100 disabled:text-gray-500 ${!session && 'text-gray-400'}`}
                                    // 鎖定條件：1. 送出中 2. 初始化中 3. 只有一個場次 4. URL鎖定
                                    disabled={status === 'loading' || isInitialLoading || sessionList.length === 1 || isSessionLocked}
                                    required
                                >
                                    {sessionList.length === 0 ? (
                                        <option>載入場次中...</option>
                                    ) : (
                                        <>
                                            {(!isSessionLocked && sessionList.length > 1) && <option value="">-- 請選擇場次 --</option>}
                                            {sessionList.map((s, index) => (
                                                <option key={index} value={s}>{s}</option>
                                            ))}
                                        </>
                                    )}
                                </select>
                                {(!isSessionLocked && sessionList.length > 1 && !isInitialLoading) && (
                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                        <svg className="h-4 w-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" /></svg>
                                    </div>
                                )}
                                </div>
                            </div>
                        )}

                        <div className="space-y-1.5">
                            <label className="text-sm font-bold text-gray-600 pl-1">員工工號 Employee ID <span className="text-red-500">*</span></label>
                            <div className="relative group">
                            <User className="absolute left-3 top-3.5 w-5 h-5 text-gray-400 group-focus-within:text-red-500 transition-colors" />
                            <input
                                type="text"
                                value={employeeId}
                                onChange={(e) => setEmployeeId(e.target.value)}
                                placeholder="例如: A001"
                                className="w-full pl-10 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:bg-white focus:border-red-500 focus:outline-none transition-all duration-200 disabled:bg-gray-50 disabled:text-gray-500"
                                disabled={status === 'loading' || isInitialLoading} // 載入中也鎖定輸入
                            />
                            </div>
                        </div>

                        <div className="space-y-1.5">
                            <label className="text-sm font-bold text-gray-600 pl-1">員工姓名 Name <span className="text-red-500">*</span></label>
                            <div className="relative group">
                            <UserCheck className="absolute left-3 top-3.5 w-5 h-5 text-gray-400 group-focus-within:text-red-500 transition-colors" />
                            <input
                                type="text"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                placeholder="請輸入姓名"
                                className="w-full pl-10 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:bg-white focus:border-red-500 focus:outline-none transition-all duration-200 disabled:bg-gray-50 disabled:text-gray-500"
                                disabled={status === 'loading' || isInitialLoading} // 載入中也鎖定輸入
                            />
                            </div>
                        </div>

                        <button
                            type="submit"
                            // 【關鍵】如果狀態是 loading 或 正在初始化載入資料，就鎖定按鈕
                            disabled={status === 'loading' || isInitialLoading}
                            className="w-full text-white font-bold py-3.5 px-4 rounded-lg shadow-md hover:shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 disabled:opacity-70 disabled:cursor-not-allowed"
                            style={{ backgroundColor: theme.primary }}
                        >
                            {(status === 'loading' || isInitialLoading) ? (
                            <>
                                <Loader2 className="w-5 h-5 animate-spin" />
                                {isInitialLoading ? '系統載入中...' : '資料驗證中...'}
                            </>
                            ) : (
                            '確認報到 Check In'
                            )}
                        </button>
                        </form>
                    )}

                    {/* 狀態: 成功 */}
                    {status === 'success' && (
                        <div className="text-center py-4 animate-in fade-in zoom-in duration-300">
                        <div className="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 relative">
                            <div className="absolute inset-0 rounded-full opacity-20 animate-ping" style={{ backgroundColor: theme.success }}></div>
                            <div className="bg-white rounded-full p-2 shadow-lg z-10">
                            <CheckCircle className="w-16 h-16" style={{ color: theme.success }} />
                            </div>
                        </div>
                        
                        <h2 className="text-2xl font-bold text-gray-800 mb-1">報到成功</h2>
                        <p className="text-sm text-gray-500 uppercase tracking-wider mb-6">Welcome to the event</p>
                        
                        <div className="bg-gray-50 rounded-xl p-6 border border-gray-100 shadow-inner mb-6">
                            <p className="text-gray-500 text-sm mb-1">已確認身份</p>
                            <p className="text-lg font-bold text-gray-800 break-words">{resultMsg}</p>
                        </div>

                        <button
                            onClick={handleReset}
                            className="w-full bg-gray-800 hover:bg-black text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                        >
                            <RefreshCcw className="w-4 h-4" />
                            報到完成 Next
                        </button>
                        </div>
                    )}

                    {/* 狀態: 重複 */}
                    {status === 'duplicate' && (
                        <div className="text-center py-4 animate-in fade-in zoom-in duration-300">
                        <div className="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 relative">
                            <div className="bg-orange-50 rounded-full p-2 shadow-lg z-10 border-4 border-white">
                            <AlertCircle className="w-16 h-16" style={{ color: theme.warning }} />
                            </div>
                        </div>
                        
                        <h2 className="text-2xl font-bold text-gray-800 mb-1">已經報到過了</h2>
                        <p className="text-sm text-gray-500 uppercase tracking-wider mb-6">Already Checked In</p>
                        
                        <div className="bg-orange-50 rounded-xl p-6 border border-orange-200 shadow-inner mb-6">
                            <p className="text-orange-600 text-sm mb-1 font-bold">系統提示</p>
                            <p className="text-lg text-gray-800 break-words">
                            {resultMsg}
                            <br/>
                            <span className="text-sm text-gray-500 font-normal mt-1 block">(無需重複報到)</span>
                            </p>
                        </div>

                        <button
                            onClick={handleReset}
                            className="w-full bg-gray-600 hover:bg-gray-700 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                        >
                            <RefreshCcw className="w-4 h-4" />
                            返回輸入 Back
                        </button>
                        </div>
                    )}

                    {/* 狀態: 失敗 */}
                    {status === 'error' && (
                        <div className="text-center py-2 animate-in fade-in zoom-in duration-300">
                        <div className="flex flex-col items-center justify-center mb-2 text-red-600">
                            <div className="flex items-center gap-2">
                                <XCircle className="w-6 h-6" />
                                <span className="font-bold text-lg">找不到報名資料</span>
                            </div>
                        </div>
                        
                        <div className="bg-white p-5 border-2 border-dashed rounded-xl mb-6 inline-block shadow-sm relative group" 
                            style={{ borderColor: theme.primary }}>
                            <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-white px-2 text-xs font-bold text-red-500 w-full text-center">
                            請向工作人員出示
                            </div>
                            
                            <img 
                            src={qrCodeUrl} 
                            alt="Error QR Code" 
                            className="w-48 h-48 mx-auto"
                            />
                            <p className="mt-2 text-xs text-gray-400">查無資料，請掃描補登</p>
                        </div>

                        <div className="text-sm text-gray-600 mb-6 bg-red-50 p-3 rounded-lg">
                            <span className="font-bold block mb-1">輸入資訊:</span>
                            <div className="text-lg font-bold text-gray-800 break-words">
                            {session && `[${session}]`}<br/> {employeeId} / {name}
                            </div>
                        </div>

                        <button
                            onClick={handleReset}
                            className="w-full border-2 border-gray-200 hover:border-gray-400 text-gray-600 font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                        >
                            <RefreshCcw className="w-4 h-4" />
                            重新輸入 Retry
                        </button>
                        </div>
                    )}

                    </div>
                    
                    <div className="bg-gray-50 px-6 py-3 border-t border-gray-100 text-center flex justify-between items-center">
                    <span className="text-[10px] text-gray-400">© DINKLE ENTERPRISE</span>
                    <div className="h-1 w-10 rounded-full" style={{ backgroundColor: theme.primary }}></div>
                    </div>
                </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
